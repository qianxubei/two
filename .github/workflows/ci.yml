name: C Project CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译C程序（本地gcc）
        run: |
          gcc -static main.c -o app
          ls -l app

      - name: 登录Harbor
        run: |
          echo "${{ secrets.HARBOR_PWD }}" | docker login ${{ secrets.HARBOR_URL }}:8081 -u ${{ secrets.HARBOR_USER }} --password-stdin

      - name: 构建镜像
        run: |
          docker build -t ${{ secrets.HARBOR_URL }}:8081/library/app:${{ github.sha }} .

      - name: 推送镜像到Harbor
        run: |
          docker push ${{ secrets.HARBOR_URL }}:8081/library/app:${{ github.sha }}

      - name: CD:停止旧容器,启动新版本
        run: |
          docker rm -f c-app || true
          docker run -d --name c-app ${{ secrets.HARBOR_URL }}:8081/library/app:${{ github.sha }}
